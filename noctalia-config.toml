[theme]
community_palette = "Catppuccin Mocha Blue"
source = "community"
    
[wallpaper]
directory = "~/Pictures/Wallpapers"

    [wallpaper.default]
    path = "~/Pictures/Wallpapers/lab.jpg"

[shell]
font_family = "JetBrainsMono Nerd Font"

    [shell.launcher]
    categories = false
    layout = "simple"
    colorize_icons = true

    [shell.panel]
    control_center_placement = "floating"
    wallpaper_placement = "floating"
    session_placement = "floating"
    clipboard_position = "auto"

[system.monitor]
cpu_poll_seconds = 1.0
memory_poll_seconds = 1.0
network_poll_seconds = 1.0

[bar.default]
margin_ends = 0
position = "left"
start = ["wallpaper", "cpu-temp", "mem", "net-up", "net-down"]
center = ["clock"]
end    = ["tray", "clipboard", "notifications", "media", "volume", "network", "bluetooth", "battery", "control-center", "session"]

[location]
address = "Chittagong"

[weather]
unit = "imperial"

[widget.control-center]
glyph = "adjustments"

[widget.clock]
type   = "clock"
format = "{:%-I:%M}"

[widget.media]
hide_when_no_media = true

[widget.notifications]
hide_when_no_unread = true

[widget.battery]
hide_when_plugged = true

[widget.cpu-temp]
type = "sysmon"
stat = "cpu_temp"

[widget.mem]
type = "sysmon"
stat = "ram_pct"

[widget.net-down]
type = "sysmon"
stat = "net_rx"
network_speed_compact = true

[widget.net-up]
type = "sysmon"
stat = "net_tx"
network_speed_compact = true
